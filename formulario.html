


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Avaliação de Produto</title>
    <meta name="description" content="Desenvolvimento de uma página de avaliação de produto.
     / Disciplina: WDD 131 / Aluno: Luciano Piechnik">
    <meta name="author" content="Luciano Milani Piechnik">
    <link rel="stylesheet" href="styles/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>

<body>

<header>
    <h1>Avaliação de Produto</h1>
</header>

<main>

<form method="get" action="avaliacao.html">

    <label for="produto">Nome do Produto *</label>

    <select id="produto" name="produto" required>
        <option value="" selected disabled>
            Selecione um produto...
        </option>
    </select>

    <fieldset>

        <legend>Classificação Geral *</legend>

        <div class="rating">

            <label for="rating1">
                <input type="radio" id="rating1" name="rating" value="1" required>
                ★
            </label>

            <label for="rating2">
                <input type="radio" id="rating2" name="rating" value="2" required>
                ★★
            </label>

            <label for="rating3">
                <input type="radio" id="rating3" name="rating" value="3" required>
                ★★★
            </label>

            <label for="rating4">
                <input type="radio" id="rating4" name="rating" value="4" required>
                ★★★★
            </label>

            <label for="rating5">
                <input type="radio" id="rating5" name="rating" value="5" required>
                ★★★★★
            </label>

        </div>

    </fieldset>

    <label for="installDate">
        Data de Instalação *
    </label>

    <input
        type="date"
        id="installDate"
        name="installDate"
        required>

    <fieldset>

        <legend>Recursos Úteis</legend>

        <label for="durabilidade">
            <input 
                type="checkbox" 
                id="durabilidade"
                name="features" 
                value="Durabilidade">
            Durabilidade
        </label>

        <label for="facilidade">
            <input 
                type="checkbox"
                id="facilidade"
                name="features" 
                value="Facilidade">
            Facilidade de uso
        </label>

        <label for="performance">
            <input 
                type="checkbox"
                id="performance"
                name="features" 
                value="Performance">
            Performance
        </label>

        <label for="design">
            <input 
                type="checkbox"
                id="design"
                name="features" 
                value="Design">
            Design
        </label>

    </fieldset>

    <label for="review">
        Avaliação Escrita
    </label>

    <textarea
        id="review"
        name="review"
        rows="5">
    </textarea>

    <label for="username">
        Nome de Usuário
    </label>

    <input
        type="text"
        id="username"
        name="username">

    <input
        type="submit"
        value="Enviar Avaliação">

</form>

</main>

<footer>

<p>&copy;2026 Seu Nome</p>

<p id="lastModified"></p>

</footer>

</body>
</html>
